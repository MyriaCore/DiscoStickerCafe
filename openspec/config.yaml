schema: spec-driven

context: |
  Product: DiscoSticker.cafe. Signed-in Discord users upload an image and get an
  unguessable link to a downscaled PNG that renders sticker-sized in Discord.
  Weekend portfolio project: keep scope small; security and auditability are core goals.

  Layout: frontend/ (Next.js), api/ (Spring Boot), gateway/ (nginx), docker compose at root.

  Stack:
  - Frontend: Next.js + TypeScript, static export (output: 'export'). No SSR, no API
    routes, no middleware, no next/image optimization; everything must work as static files.
  - Backend: Spring Boot + Spring Security, OAuth2 login with Discord. Postgres + Flyway.
  - Storage: SeaweedFS's S3 endpoint locally, S3 in production. The app uses only the
    S3 API; endpoint, credentials, and path-style access are configuration. Not MinIO:
    its free images are no longer published.
  - Gateway: nginx, single origin. / -> frontend; /api/*, /oauth2/*, /login/oauth2/*,
    and /s/* -> Spring Boot.
  - Everything runs under docker compose.

  Decision log: docs/decisions.md records why each project decision was made. Edit it
  only when the user explicitly asks; decisions are approved in the user's PM session
  before they go in. If a change would contradict a recorded decision, stop and ask.

  Non-negotiable constraints:
  - Test-first where practical. Every task states how it is verified: a test, a type
    check, or a command against the running stack.
  - Uploads: size limit enforced at nginx and in Spring; type detected from content
    (magic bytes), never from extension or Content-Type; dimensions checked before full
    decode; image re-encoded server-side to PNG. Original bytes are never stored or
    served; the audit record keeps their SHA-256.
  - Per-user upload rate limits.
  - Audit records for logins and uploads, accepted and rejected.
  - Public IDs are 128-bit random, base64url-encoded. Database keys never appear in URLs.
  - The browser talks only to nginx. No CORS configuration.
  - Ban and account-age checks run at login, before a session is created.
  - Bans are set manually in the database for now; no ban UI or ban audit events.
  - Secrets live only in gitignored secrets.env. Reference secrets by variable name only;
    never put a value in code, config, compose files, tests, or artifacts. The committed
    secrets.env.example lists the same names with placeholder values. Production secret
    handling is undecided and is not in scope.
  - Never run `docker compose config` with secrets.env, or `docker inspect` on services that hold secrets; both print secret values. Config checks use secrets.env.example only.

rules:
  proposal:
    - State what is out of scope.
    - Call out any effect on the security constraints in context, or say there is none.
  design:
    - For anything touching auth, sessions, uploads, or storage, list the threats
      considered and how each is handled.
  tasks:
    - Write the test task before the implementation task it covers, where practical.
    - Every task ends with a "Verify:" line giving the exact test, type check, or command.
