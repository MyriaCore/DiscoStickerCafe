spring:
  application:
    name: api
  security:
    oauth2:
      client:
        registration:
          discord:
            provider: discord
            # Public; set per environment by compose. The secret comes from secrets.env only.
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            # Required for a custom provider. /login/ is literal: {action} could be overridden
            # by an ?action= query parameter. {baseUrl} is the client-facing origin.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            # Versioned: an unversioned route goes to API v6.
            user-info-uri: https://discord.com/api/v10/users/@me
            user-name-attribute: id
  servlet:
    multipart:
      # The upload limit, from app.upload below. The gateway allows 11m on /api/stickers, so a
      # file just over this reaches the api and is rejected and audited here.
      max-file-size: ${app.upload.max-file-size}
      # max-file-size plus 64 KiB of multipart framing.
      max-request-size: 10304KB
      # Parse a body only when the upload controller reads its parts; no other endpoint parses one.
      resolve-lazily: true

server:
  # Trust X-Forwarded-* from nginx (Tomcat's RemoteIpValve accepts private-range proxies only).
  forward-headers-strategy: native
  servlet:
    session:
      # Pre-login sessions (they hold only the OAuth state). Signing in raises it to 8 hours.
      timeout: 10m
      # Never put the session ID in a URL.
      tracking-modes: cookie
      cookie:
        # compose.prod.yaml renames it __Host-SESSION (needs HTTPS). Secure follows the
        # forwarded scheme. Lax, not Strict: Discord's redirect back is a cross-site navigation.
        name: SESSION
        http-only: true
        same-site: lax
  tomcat:
    # Location: / rather than an absolute URL built from the request's host.
    use-relative-redirects: true
    # More than the gateway ever forwards (11 MiB), so an upload rejected early is read to the
    # end and nginx gets the api's response instead of a reset connection.
    max-swallow-size: 12MB

app:
  upload:
    # Images larger than this square box are shrunk to fit it; smaller ones keep their size.
    sticker-size: 160
    # Binary units: 10MB is 10,485,760 bytes.
    max-file-size: 10MB
    uploads-per-hour: 20
    # Read from the image header, before any pixels are decoded.
    max-side: 8192
    max-pixels: 32000000
    decode-permits: 2
    decode-wait: 10s

management:
  endpoints:
    web:
      # Health lives at /api/health so the gateway's /api/ prefix covers it.
      base-path: /api
      exposure:
        include: health
