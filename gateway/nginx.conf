user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    on;
    keepalive_timeout  65;
    server_tokens  off;

    server {
        # Same port as the host mapping, so $server_port matches what the browser sees.
        listen 8080;
        absolute_redirect off;

        root  /usr/share/nginx/html;
        index index.html;

        # ^~ stops any later regex location from capturing these prefixes.
        # proxy_pass has no URI part, so the path reaches the api unchanged.
        location ^~ /api/ {
            proxy_pass http://api:8080;
            include /etc/nginx/proxy_headers.conf;
        }

        location ^~ /oauth2/ {
            proxy_pass http://api:8080;
            include /etc/nginx/proxy_headers.conf;
        }

        location ^~ /login/oauth2/ {
            proxy_pass http://api:8080;
            include /etc/nginx/proxy_headers.conf;
        }

        location ^~ /s/ {
            proxy_pass http://api:8080;
            include /etc/nginx/proxy_headers.conf;
        }

        # Static export only; unknown paths are a plain 404, never index.html.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
