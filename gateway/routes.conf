# Routes for the site, shared by the local server (conf.d/local.conf) and the
# production HTTPS server (prod/discosticker.conf) so the two can't drift.
# Include at server level. Never set response headers in here: a location that sets
# its own headers drops every server-level one, including the security headers.

absolute_redirect off;

root  /usr/share/nginx/html;
index index.html;

# ^~ stops any later regex location from capturing these prefixes.
# proxy_pass has no URI part, so the path reaches the api unchanged.
location ^~ /api/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy_headers.conf;
}

location ^~ /oauth2/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy_headers.conf;
}

location ^~ /login/oauth2/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy_headers.conf;
}

location ^~ /s/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy_headers.conf;
}

# Static export only; unknown paths are a plain 404, never index.html.
location / {
    try_files $uri $uri/ =404;
}
