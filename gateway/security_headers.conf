# Security headers for every HTTPS response in production.
# Include at server level only. `always` adds them to error responses and to responses
# proxied from the api too. HSTS starts short, with no includeSubDomains or preload,
# so a TLS mistake can be backed out within minutes.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
