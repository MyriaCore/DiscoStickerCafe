# Describe the client-facing request to the api. proxy_set_header overwrites any
# client-supplied X-Forwarded-Proto/Host/Port. X-Forwarded-For is appended, so the
# right-most entry is the one nginx added.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# nginx is the only source of the security headers (security_headers.conf). Drop the
# api's own copies: add_header appends rather than replaces, and browsers honor the
# first HSTS header, so Spring Security's one-year HSTS would beat max-age=300.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
