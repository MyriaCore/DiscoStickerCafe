# Production server blocks. compose.prod.yaml mounts this directory over
# /etc/nginx/conf.d/, replacing the local server (conf.d/local.conf).
# Certificates come from certbot on the host (/etc/letsencrypt, mounted read-only).

# TLS settings for every server below (this file is included at http level).
# No OCSP stapling: Let's Encrypt certificates no longer carry OCSP URLs.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Port 80: ACME HTTP-01 challenges for certbot's webroot renewals; everything else
# redirects to HTTPS. The redirect host is fixed, never taken from the request.
server {
    listen 80;
    server_name discosticker.cafe www.discosticker.cafe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://discosticker.cafe$request_uri;
    }
}

# Any other Host header, including requests to the bare IP: close the connection.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# The site. Only this server includes routes.conf, so only HTTPS requests on 443 reach
# the api, and the forwarded headers say https and 443.
server {
    listen 443 ssl;
    http2 on;
    server_name discosticker.cafe;

    ssl_certificate     /etc/letsencrypt/live/discosticker.cafe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discosticker.cafe/privkey.pem;

    include /etc/nginx/security_headers.conf;
    include /etc/nginx/routes.conf;
}

# www redirects to the apex.
server {
    listen 443 ssl;
    http2 on;
    server_name www.discosticker.cafe;

    ssl_certificate     /etc/letsencrypt/live/discosticker.cafe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discosticker.cafe/privkey.pem;

    include /etc/nginx/security_headers.conf;
    return 301 https://discosticker.cafe$request_uri;
}

# Any other server name, or none (a connection to the bare IP): refuse the handshake
# without presenting a certificate.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
